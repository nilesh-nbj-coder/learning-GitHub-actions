name: my-first-workflow
on: 
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: 
  push: 
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: running single command in JOB1
        run: echo "Hi this is my first github workflow"
      - name: checking OS release for GitHub hosted runner
        run: cat /etc/os-release
      - name: calling sleep
        run: sleep 20
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: checking the hostname for runner
        run: hostname
      - name: running multiple command
        run: |
          echo "Hi i am Nlesh testing it"
          echo "current time is 'date'"
          sleep 20
  job3:
   name: JOB3
   needs: job1
   runs-on: ubuntu-latest
   steps:
     - name: job with single depedancy
       run: sleep 10

  job4:
   name: JOB4
   needs: [job1,job2,job3]
   runs-on: ubuntu-latest
   steps:
     - name: job with multiple depedancy
       run: sleep 10



       
